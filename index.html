<title>多言語クロスワード｜日本語・한국어・English で遊べる無料クロスワード</title>
<meta name="description" content="日本語・韓国語・英語で遊べる無料のクロスワードパズル。果物・動物・国など8つのお題と3段階の難易度。スマホでもPCでもすぐ遊べます。 / Free crossword puzzles in Japanese, Korean and English.">
<meta property="og:type" content="website">
<meta property="og:title" content="多言語クロスワード / Multilingual Crossword">
<meta property="og:description" content="日本語・한국어・English で遊べる無料クロスワード。Free crosswords in 3 languages.">
<meta name="theme-color" content="#EFF3EA">
<link rel="canonical" href="https://crossword.labfond.com/">
<meta property="og:url" content="https://crossword.labfond.com/">
<meta property="og:image" content="https://crossword.labfond.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:site_name" content="多言語クロスワード">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFF3EA;
    --paper-panel: #F7FAF3;
    --grid-line: #C7D2BE;
    --ink: #223022;
    --ink-soft: #556354;
    --block: #223022;
    --accent: #E07B10;
    --accent-soft: #F3D6AE;
    --success: #4F7F35;
    --success-soft: #DCEACC;
    --error: #B94A3D;
    --error-soft: #F5D9D3;
    --tab-idle: #DCE4D4;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171D16;
      --paper-panel: #1E2620;
      --grid-line: #3A4636;
      --ink: #EAF0E4;
      --ink-soft: #AFBBA6;
      --block: #EAF0E4;
      --accent: #F2A24E;
      --accent-soft: #4A3A22;
      --success: #8DC26C;
      --success-soft: #2C3B24;
      --error: #E08A7C;
      --error-soft: #442823;
      --tab-idle: #263023;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171D16;
    --paper-panel: #1E2620;
    --grid-line: #3A4636;
    --ink: #EAF0E4;
    --ink-soft: #AFBBA6;
    --block: #EAF0E4;
    --accent: #F2A24E;
    --accent-soft: #4A3A22;
    --success: #8DC26C;
    --success-soft: #2C3B24;
    --error: #E08A7C;
    --error-soft: #442823;
    --tab-idle: #263023;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
    background-attachment: local;
    color: var(--ink);
    font-family: 'Fraunces', Georgia, 'Hiragino Mincho ProN', serif;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header.hero {
    padding: 6px 2px 18px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 22px;
  }
  header.hero h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(28px, 6vw, 42px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    line-height: 1.05;
  }
  header.hero p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 17px;
    max-width: 60ch;
    line-height: 1.9;
  }
  header.hero.hero-collapsed {
    display: none;
  }
  /* On wide screens there is plenty of vertical room, and the page looks
     top-heavy without a title, so keep a compact title bar visible in every
     view (only the language-prompt subtitle is dropped). Phones keep the
     fully collapsed hero to save space. */
  @media (min-width: 720px) {
    body { padding-top: 36px; }
    header.hero.hero-collapsed { display: block; padding-bottom: 12px; margin-bottom: 18px; }
    header.hero.hero-collapsed p { display: none; }
  }

  .hidden { display: none !important; }

  /* ---- home view: language picker ---- */
  .lang-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 640px) {
    .lang-cards { grid-template-columns: repeat(3, 1fr); }
  }
  .lang-card {
    font-family: 'Fraunces', serif;
    text-align: left;
    background: var(--paper-panel);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 22px 20px;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .lang-card:hover { background: var(--accent-soft); transform: translateY(-2px); }
  .lang-card:active { transform: translateY(0); }
  .lang-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lang-card .native {
    display: block;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .lang-card .caption {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* ---- difficulty view ---- */
  .crumb {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .crumb button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    border: none;
    background: none;
    color: var(--accent);
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  .diff-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) {
    .diff-cards { grid-template-columns: repeat(3, 1fr); }
  }
  .diff-card {
    text-align: left;
    background: var(--paper-panel);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 18px 18px;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease;
    font-family: inherit;
    color: var(--ink);
  }
  .diff-card:hover { background: var(--accent-soft); transform: translateY(-2px); }
  .diff-card:active { transform: translateY(0); }
  .diff-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .diff-card .dots { font-family: 'IBM Plex Mono', monospace; letter-spacing: 3px; color: var(--accent); font-size: 14px; margin-bottom: 8px; }
  .diff-card .label {
    display: block;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin-bottom: 6px;
  }
  .diff-card .desc {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .play-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .play-badge strong { color: var(--ink); font-weight: 600; }
  .play-badge button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    border: none;
    background: none;
    color: var(--accent);
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    border: 2px solid var(--ink);
    background: var(--paper-panel);
    padding: 12px;
    border-radius: 0 8px 8px 8px;
    margin-bottom: 18px;
  }
  .toolbar label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }
  select#topicSelect {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 7px 10px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
  }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }
  button:hover { background: var(--accent-soft); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spacer { flex: 1; }

  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 14px;
    color: var(--ink-soft);
  }
  .status-line.correct { color: var(--success); font-weight: 600; }
  .status-line.wrong { color: var(--error); }

  /* On mobile the clue list sits below the grid (single-column board),
     so reading a clue means scrolling away from the grid. This bar sits
     right above the grid and shows whichever clue is currently active,
     updated on every cell/word focus, so the clue is visible without
     scrolling. Hidden once the clue list becomes a visible side panel. */
  .active-clue-bar {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: var(--accent-soft);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 15px;
    line-height: 1.5;
  }
  .active-clue-number {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    flex-shrink: 0;
  }
  .active-clue-text { color: var(--ink); }
  @media (min-width: 720px) {
    .active-clue-bar { display: none !important; }
  }

  .board {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 22px;
  }
  @media (min-width: 720px) {
    .board { grid-template-columns: auto minmax(260px, 1fr); align-items: start; }
    /* On the advanced grid especially, the clue list can run much longer
       than the grid is tall, forcing the whole page to scroll a long way
       just to reach the down clues. Giving the clue column its own
       scrollable, viewport-anchored box keeps both the grid and the clue
       list on screen together instead. */
    .clues {
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      position: sticky;
      top: 16px;
      padding-right: 8px;
    }
  }

  .grid-panel {
    border: 2px solid var(--ink);
    background: var(--paper-panel);
    padding: 14px;
    border-radius: 8px;
    overflow-x: auto;
    display: flex;
    justify-content: center;
  }
  #grid {
    display: grid;
    gap: 2px;
    background: var(--ink);
    border: 2px solid var(--ink);
    width: max-content;
  }
  .cell {
    position: relative;
    width: 34px;
    height: 34px;
    background: var(--paper);
  }
  .cell.block { background: var(--block); }
  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-family: 'IBM Plex Mono', 'Hiragino Sans', 'Noto Sans KR', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    caret-color: var(--accent);
    padding: 0;
    text-transform: uppercase;
  }
  .cell input:focus { outline: none; background: var(--accent-soft); }
  .cell.active-word input:not(:focus) { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  .cell.correct input { color: var(--success); }
  .cell.wrong input { background: var(--error-soft); }
  .cell .num {
    position: absolute;
    top: 1px;
    left: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8.5px;
    color: var(--ink-soft);
    pointer-events: none;
    line-height: 1;
  }
  @media (min-width: 480px) {
    .cell { width: 38px; height: 38px; }
    .cell input { font-size: 17px; }
  }

  .clues { display: flex; flex-direction: column; gap: 18px; }
  .clue-group h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin: 0 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--grid-line);
  }
  .clue-group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .clue-group li {
    display: flex;
    gap: 8px;
    font-size: 14px;
    line-height: 1.45;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .clue-group li:hover { background: var(--accent-soft); }
  .clue-group li.active { background: var(--accent-soft); font-weight: 600; }
  .clue-group li .n {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    flex-shrink: 0;
    min-width: 1.4em;
  }

  footer.note {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--grid-line);
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ---- light/dark toggle ---- */
  .theme-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 60;
    width: 42px;
    height: 42px;
    line-height: 1;
    font-size: 18px;
    border: 2px solid var(--ink);
    background: var(--paper-panel);
    color: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    transition: transform .12s ease, background .15s ease;
  }
  .theme-toggle:hover { background: var(--accent-soft); transform: translateY(-1px); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (min-width: 640px) {
    .theme-toggle { top: 20px; right: 20px; }
  }

  /* ---- site-wide footer ---- */
  .site-footer {
    max-width: 920px;
    margin: 36px auto 0;
    padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--grid-line);
    text-align: center;
  }
  .site-footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 18px;
    margin-bottom: 10px;
  }
  .footer-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border: none;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .footer-link:hover { color: var(--accent); }
  .footer-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .site-footer-copy {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0;
    opacity: 0.8;
  }

  /* ---- info modal (使い方 / FAQ / 運営者情報 / プライバシーポリシー) ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    position: relative;
    background: var(--paper-panel);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 10px;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 28px 24px 24px;
  }
  .modal-box h2 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0 0 14px;
  }
  .modal-body { font-size: 14px; line-height: 1.75; }
  .modal-body h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 18px 0 6px;
  }
  .modal-body h3:first-child { margin-top: 0; }
  .modal-body p { margin: 0 0 10px; }
  .modal-body ol, .modal-body ul { margin: 0 0 10px; padding-left: 1.3em; }
  .modal-body li { margin-bottom: 6px; }
  .modal-body a { color: var(--accent); }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border: none;
    background: none;
    color: var(--ink-soft);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    border-radius: 6px;
  }
  .modal-close:hover { background: var(--accent-soft); color: var(--ink); }
  .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<button id="themeToggleBtn" class="theme-toggle" type="button" aria-label="ダークモード切り替え" title="ダークモード切り替え">🌙</button>
<div class="wrap">
  <header class="hero" id="hero">
    <h1>多言語クロスワード</h1>
    <p id="heroSubtitle">
      あそびたい言語をえらんでね<br>
      플레이할 언어를 선택하세요<br>
      Choose a language to play in.
    </p>
  </header>

  <!-- SCREEN 1: language picker -->
  <div id="homeView">
    <div class="lang-cards">
      <button class="lang-card" data-lang="ja">
        <span class="native">日本語</span>
        <span class="caption">JAPANESE</span>
      </button>
      <button class="lang-card" data-lang="ko">
        <span class="native">한국어</span>
        <span class="caption">KOREAN</span>
      </button>
      <button class="lang-card" data-lang="en">
        <span class="native">English</span>
        <span class="caption">ENGLISH</span>
      </button>
    </div>
  </div>

  <!-- SCREEN 2: difficulty picker -->
  <div id="difficultyView" class="hidden">
    <div class="crumb"><button id="backToHomeBtn">&larr; <span id="backToHomeLabel">言語をえらびなおす</span></button></div>
    <div class="diff-cards" id="diffCards"></div>
  </div>

  <!-- SCREEN 3: the puzzle -->
  <div id="puzzleView" class="hidden">
    <div class="crumb"><button id="backToDiffBtn">&larr; <span id="backToDiffLabel">難易度を変える</span></button></div>
    <div class="play-badge">
      <span><strong id="badgeLang"></strong> ・ <span id="badgeDiff"></span></span>
    </div>

    <div class="toolbar">
      <label for="topicSelect" id="topicLabel">お題</label>
      <select id="topicSelect"></select>
      <button id="newPuzzleBtn" class="primary">🔄 <span id="newPuzzleLabel">新しいパズル</span></button>
      <div class="spacer"></div>
      <button id="checkBtn"><span id="checkLabel">答え合わせ</span></button>
      <button id="revealBtn"><span id="revealLabel">答えを見る</span></button>
    </div>

    <div class="status-line" id="statusLine"></div>

    <div id="activeClueBar" class="active-clue-bar hidden">
      <span id="activeClueNumber" class="active-clue-number"></span>
      <span id="activeClueText" class="active-clue-text"></span>
    </div>

    <div class="board">
      <div class="grid-panel"><div id="grid"></div></div>
      <div class="clues">
        <div class="clue-group">
          <h2 id="acrossLabel">よこ (ACROSS)</h2>
          <ul id="acrossList"></ul>
        </div>
        <div class="clue-group">
          <h2 id="downLabel">たて (DOWN)</h2>
          <ul id="downList"></ul>
        </div>
      </div>
    </div>

    <footer class="note" id="footerNote">
      このパズルはブラウザ上でランダム生成されています。単語同士の重なり方によって、出題数は毎回多少前後します。
    </footer>
  </div>
</div>

  <nav class="site-footer-links">

    <a class="footer-link" href="/faq.html">よくある質問</a>
    <a class="footer-link" href="/about.html">運営者情報</a>

/* ---------------------------------------------------------
   3. CROSSWORD GENERATOR  (verified in isolation before
      being wired into the UI)
--------------------------------------------------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function chars(w){ return Array.from(w); }

function generateCrossword(wordEntries, maxWords, attempts, gridSize){
  maxWords = maxWords || 10;
  attempts = attempts || 400;
  let best = null;
  for(let attempt=0; attempt<attempts; attempt++){
    const pool = shuffle(wordEntries);
    const cellLetter = new Map();
    const cellAcross = new Set();
    const cellDown = new Set();
    // cellOwner tracks which placed[] word "first wrote" each cell, so we
    // can tell how many other words already cross a given word (its
    // degree). Piling every new word onto the same already-busy word is
    // what produced the tightly-clustered hubs players flagged, so
    // candidate scoring below prefers crossing lightly-used words instead.
    const cellOwner = new Map();
    const wordDegree = [];
    const placed = [];
    function key(r,c){ return r+","+c; }
    // Distance of a candidate word's midpoint from the grid's center.
    // When a fixed gridSize is given, this is used as a tie-break so
    // later words fan outward evenly from the middle instead of piling
    // toward one edge and leaving the opposite side of the square empty.
    const center = gridSize ? (gridSize-1)/2 : 0;
    function centerDist(row, col, dir, L){
      if(!gridSize) return 0;
      const midR = dir==="down" ? row + (L-1)/2 : row;
      const midC = dir==="across" ? col + (L-1)/2 : col;
      return Math.abs(midR-center) + Math.abs(midC-center);
    }

    function fits(word, row, col, dir){
      const L = word.length;
      if(gridSize){
        if(dir==="across"){
          if(row<0 || row>=gridSize || col<0 || col+L>gridSize) return false;
        } else {
          if(col<0 || col>=gridSize || row<0 || row+L>gridSize) return false;
        }
      }
      if(dir==="across"){
        if(cellLetter.has(key(row,col-1))) return false;
        if(cellLetter.has(key(row,col+L))) return false;
      } else {
        if(cellLetter.has(key(row-1,col))) return false;
        if(cellLetter.has(key(row+L,col))) return false;
      }
      let overlapCount = 0;
      const owners = new Set();
      for(let i=0;i<L;i++){
        const r = dir==="down" ? row+i : row;
        const c = dir==="across" ? col+i : col;
        const k = key(r,c);
        const ch = word[i];
        if(cellLetter.has(k)){
          if(cellLetter.get(k) !== ch) return false;
          if(dir==="across" && cellAcross.has(k)) return false;
          if(dir==="down" && cellDown.has(k)) return false;
          overlapCount++;
          owners.add(cellOwner.get(k));
        } else {
          if(dir==="across"){
            if(cellLetter.has(key(r-1,c))) return false;
            if(cellLetter.has(key(r+1,c))) return false;
          } else {
            if(cellLetter.has(key(r,c-1))) return false;
            if(cellLetter.has(key(r,c+1))) return false;
          }
        }
      }
      if(overlapCount === 0) return false;
      // degree = how many words already cross the busiest anchor word this
      // candidate would attach to; used to steer new words toward
      // lightly-crossed words instead of piling onto the same hub.
      let maxDegree = 0;
      owners.forEach(o => { maxDegree = Math.max(maxDegree, wordDegree[o] || 0); });
      return { overlapCount, owners, degree: maxDegree };
    }
    function place(word, row, col, dir, wordIdx){
      const L = word.length;
      for(let i=0;i<L;i++){
        const r = dir==="down" ? row+i : row;
        const c = dir==="across" ? col+i : col;
        const k = key(r,c);
        if(cellLetter.has(k)){
          const owner = cellOwner.get(k);
          wordDegree[owner] = (wordDegree[owner] || 0) + 1;
        } else {
          cellLetter.set(k, word[i]);
          cellOwner.set(k, wordIdx);
        }
        if(dir==="across") cellAcross.add(k); else cellDown.add(k);
      }
      wordDegree[wordIdx] = wordDegree[wordIdx] || 0;
    }
    // Score candidates so the best-laid-out option is tried first: prefer
    // crossing a lightly-used word (spreads connections out, avoids dense
    // hubs), then prefer whichever placement sits closer to the grid's
    // center (fills the fixed square evenly instead of drifting toward
    // one edge and leaving the rest empty).
    function isBetter(a, b){
      if(a.res.overlapCount !== b.res.overlapCount) return a.res.overlapCount < b.res.overlapCount;
      if(a.res.degree !== b.res.degree) return a.res.degree < b.res.degree;
      return a.dist < b.dist;
    }
    function bestCandidate(candidates, wChars){
      let best = null;
      for(const cand of candidates){
        const res = fits(wChars, cand.row, cand.col, cand.dir);
        if(!res) continue;
        const dist = centerDist(cand.row, cand.col, cand.dir, wChars.length);
        const scored = { cand, res, dist };
        if(!best || isBetter(scored, best)) best = scored;
      }
      return best;
    }

    const first = pool[0];
    const firstChars = chars(first.w);
    // Center the very first word in the fixed square (when one is given)
    // so later words have room to branch outward in every direction
    // instead of only growing right/down from a top-left corner.
    const firstRow = gridSize ? Math.floor((gridSize-1)/2) : 0;
    const firstCol = gridSize ? Math.max(0, Math.floor((gridSize-firstChars.length)/2)) : 0;
    place(firstChars, firstRow, firstCol, "across", 0);
    placed.push({entry:first, row:firstRow, col:firstCol, dir:"across", len:firstChars.length});

    for(let idx=1; idx<pool.length; idx++){
      if(placed.length >= maxWords) break;
      const entry = pool[idx];
      const wChars = chars(entry.w);
      const candidates = [];
      for(let li=0; li<wChars.length; li++){
        const ch = wChars[li];
        for(const [k, letter] of cellLetter){
          if(letter !== ch) continue;
          const parts = k.split(",");
          const r = Number(parts[0]), c = Number(parts[1]);
          for(const dir of ["across","down"]){
            const usedSet = dir==="across" ? cellAcross : cellDown;
            if(usedSet.has(k)) continue;
            const row = dir==="down" ? r-li : r;
            const col = dir==="across" ? c-li : c;
            candidates.push({row,col,dir});
          }
        }
      }
      const shuffled = shuffle(candidates);
      // Two passes: first only consider placements that cross exactly one
      // existing word (a single shared letter, the normal crossword case).
      // Multiple simultaneous overlaps make solving one word give away
      // several others at once, which is what made earlier puzzles feel
      // "too revealing." Only fall back to allowing extra overlaps if no
      // single-overlap placement exists, so words don't get skipped and
      // fewer words fit than the target. Within each pass, bestCandidate()
      // picks the placement that best spreads out crossings and keeps the
      // grid compact, rather than just the first one found.
      const singleOverlap = shuffled.filter(c => {
        const r = fits(wChars, c.row, c.col, c.dir);
        return r && r.overlapCount === 1;
      });
      let chosen = singleOverlap.length ? bestCandidate(singleOverlap, wChars) : null;
      if(!chosen) chosen = bestCandidate(shuffled, wChars);
      if(chosen){
        const wordIdx = placed.length;
        place(wChars, chosen.cand.row, chosen.cand.col, chosen.cand.dir, wordIdx);
        placed.push({entry, row:chosen.cand.row, col:chosen.cand.col, dir:chosen.cand.dir, len:wChars.length});
      }
    }

    if(!best || placed.length > best.placed.length) best = { placed: placed };
    if(placed.length >= Math.min(maxWords, wordEntries.length)) break;
  }
  return best;
}

function buildGrid(result, gridSize){
  const placed = result.placed;
  let minR=Infinity,maxR=-Infinity,minC=Infinity,maxC=-Infinity;
  for(const p of placed){
    const L = p.len;
    const endR = p.dir==="down" ? p.row+L-1 : p.row;
    const endC = p.dir==="across" ? p.col+L-1 : p.col;
    minR=Math.min(minR,p.row,endR); maxR=Math.max(maxR,p.row,endR);
    minC=Math.min(minC,p.col,endC); maxC=Math.max(maxC,p.col,endC);
  }
  // When a fixed gridSize was passed to generateCrossword, every placed
  // letter already sits inside [0, gridSize), so the rendered grid is the
  // full square rather than a tight shrink-wrap around just the letters —
  // that's what makes the board read as "an 8x8 / 10x10 / 15x15 frame."
  const rows = gridSize || (maxR-minR+1), cols = gridSize || (maxC-minC+1);
  if(gridSize){ minR = 0; minC = 0; }
  const grid = Array.from({length:rows},()=>Array(cols).fill(null));
  for(const p of placed){
    const wChars = chars(p.entry.w);
    for(let i=0;i<wChars.length;i++){
      const r = (p.dir==="down"? p.row+i : p.row) - minR;
      const c = (p.dir==="across"? p.col+i : p.col) - minC;
      grid[r][c] = wChars[i];
    }
  }
  const numberAt = new Map();
  let num = 1;
  // General-topic banks include some 1-letter answers (め, て, 눈, 손, ...),
  // which only ever get placed by crossing into the *middle* of a longer
  // word — the normal "starts across/down" adjacency test below never
  // fires for them, since they have no run of their own. Without this,
  // those words would render with no clue number at all. So every placed
  // word's own start cell is also forced to get a number, even when it
  // sits mid-run of a different word.
  const wordStarts = new Set();
  for(const p of placed){
    wordStarts.add((p.row - minR) + "," + (p.col - minC));
  }
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(!grid[r][c]) continue;
      const startsAcross = (c===0 || !grid[r][c-1]) && (c+1<cols && grid[r][c+1]);
      const startsDown = (r===0 || !grid[r-1][c]) && (r+1<rows && grid[r+1][c]);
      const isWordStart = wordStarts.has(r+","+c);
      if(startsAcross || startsDown || isWordStart){
        numberAt.set(r+","+c, num);
        num++;
      }
    }
  }
  // attach numbers + normalized coords to placed words
  const words = placed.map((p, srcIndex) => {
    const r0 = p.row - minR, c0 = p.col - minC;
    return {
      clue: p.entry.c,
      answer: chars(p.entry.w),
      row: r0, col: c0, dir: p.dir, len: p.len,
      number: numberAt.get(r0+","+c0),
      // Index into the *original* placed[] array this word came from,
      // captured before the sort below reorders everything by clue
      // number. trimThinBorders() needs this to remove the right word
      // from the raw placed list — a plain array position in the sorted
      // `words` array does not correspond to the same word's position in
      // placed[], and using it as if it did silently deletes the wrong
      // word.
      srcIndex
    };
  }).sort((a,b)=> a.number - b.number);

  return { grid, rows, cols, words };
}

// Counts how many of a built grid's 4 *border* lines (its first/last row,
// first/last column) are "thin" — holding at most maxFill filled cells.
// This is deliberately scoped to just the border, not every row/column:
// an ordinary interior column that's crossed by only one across word (and
// no down word) is completely normal in a crossword — most of a word's
// letters aren't intersection points — and trying to stamp those out too
// would mean rejecting almost every layout these word banks can produce,
// gutting the puzzle for no visual benefit. What actually reads as
// "wasted" is a straggler at the very edge: a border row/column holding
// just one lonely letter (or, before cropToContent ran, none at all),
// which looks like an afterthought sticking out past the rest of the
// board. cropToContent() already rules out a fully-empty border by
// construction, so with maxFill=1 this only ever flags the one-letter
// case. generateFilledPuzzle()/generateSelfSizedPuzzle() use it to reject
// attempts that produce one.
function countThinBorderLines(puzzle, maxFill){
  const { grid, rows, cols } = puzzle;
  if(rows === 0 || cols === 0) return 0;
  const fillOf = (cells) => cells.reduce((n, v) => n + (v ? 1 : 0), 0);
  let n = 0;
  if(fillOf(grid[0]) <= maxFill) n++;
  if(rows > 1 && fillOf(grid[rows-1]) <= maxFill) n++;
  if(fillOf(grid.map(row => row[0])) <= maxFill) n++;
  if(cols > 1 && fillOf(grid.map(row => row[cols-1])) <= maxFill) n++;
  return n;
}

// Finds the one filled cell in whichever border line is thin (see
// countThinBorderLines), checking top/bottom row then left/right column,
// or null if the border is clean.
function firstThinBorderCell(puzzle, maxFill){
  const { grid, rows, cols } = puzzle;
  if(rows === 0 || cols === 0) return null;
  function loneInRow(r){
    let count = 0, lastC = -1;
    for(let c=0;c<cols;c++){ if(grid[r][c]){ count++; lastC = c; } }
    return count <= maxFill ? { r, c: lastC } : null;
  }
  function loneInCol(c){
    let count = 0, lastR = -1;
    for(let r=0;r<rows;r++){ if(grid[r][c]){ count++; lastR = r; } }
    return count <= maxFill ? { r: lastR, c } : null;
  }
  return loneInRow(0) || (rows > 1 && loneInRow(rows-1)) || loneInCol(0) || (cols > 1 && loneInCol(cols-1)) || null;
}

function wordAtCell(words, r, c){
  for(const w of words){
    if(w.dir === "across"){
      if(w.row === r && c >= w.col && c < w.col + w.len) return w;
    } else {
      if(w.col === c && r >= w.row && r < w.row + w.len) return w;
    }
  }
  return null;
}

// True unless the puzzle's letters form two or more separate islands with
// gaps between them — flood-fills from one filled cell through its
// 4-directional neighbors and checks every filled cell got reached.
// generateCrossword() itself can't produce this (every word it places is
// required to cross at least one already-placed word), but removing a
// word during trimThinBorders() can: if that word was the only bridge
// between two otherwise-separate clusters, deleting it splits the puzzle
// in two, with the gap between them showing up as an empty interior
// row/column. trimThinBorders() uses this to make sure it never does that.
function isFullyConnected(puzzle){
  const { grid, rows, cols } = puzzle;
  let start = null, totalFilled = 0;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(grid[r][c]){
        totalFilled++;
        if(!start) start = { r, c };
      }
    }
  }
  if(!start) return true;
  const seen = new Set([start.r + "," + start.c]);
  const stack = [start];
  while(stack.length){
    const { r, c } = stack.pop();
    for(const [nr, nc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){
      if(nr<0 || nr>=rows || nc<0 || nc>=cols || !grid[nr][nc]) continue;
      const key = nr + "," + nc;
      if(seen.has(key)) continue;
      seen.add(key);
      stack.push({ r: nr, c: nc });
    }
  }
  return seen.size === totalFilled;
}

// Last-resort cleanup for when no generation attempt came back with a
// clean border within its retry budget: rather than shipping a board with
// a near-empty edge, prune the specific word responsible for it. A thin
// border row/column exists because exactly one word happens to reach
// further than everything else around it — dropping that one word (and
// re-cropping) removes the thin line outright, at the cost of one fewer
// word in the puzzle. Removing one straggler can occasionally expose
// another word as the new border's sole occupant, so this repeats a few
// times — but it's capped by minWords (never trims below that many words)
// as well as an iteration count, so a puzzle that's inherently too sparse
// to ever have a fully "supported" border (a lone word crossing the
// middle of an otherwise-empty board, say) settles for its best effort
// rather than getting trimmed away to nothing.
//
// Critically, a candidate removal is only ever kept if the *rest* of the
// puzzle is still one connected piece afterward (isFullyConnected). The
// one word touching a thin border is sometimes also the only bridge
// joining two clusters of words — deleting it would split the board into
// disconnected islands with a dead gap between them, which is a far worse
// defect than the thin border it was trying to fix. When that's the case,
// the word is left in place and the thin border is accepted instead.
function trimThinBorders(rawPlaced, gridSize, maxFill, minWords){
  let placed = rawPlaced.slice();
  let built = cropToContent(buildGrid({ placed }, gridSize));
  const original = built;
  for(let iter=0; iter<8 && placed.length > minWords; iter++){
    const thin = firstThinBorderCell(built, maxFill);
    if(!thin) break;
    const word = wordAtCell(built.words, thin.r, thin.c);
    if(!word) break;
    const candidatePlaced = placed.slice();
    candidatePlaced.splice(word.srcIndex, 1);
    const candidateBuilt = cropToContent(buildGrid({ placed: candidatePlaced }, gridSize));
    if(!isFullyConnected(candidateBuilt)) break; // would disconnect the puzzle — keep the word, accept the thin border
    placed = candidatePlaced;
    built = candidateBuilt;
  }
  // If trimming still couldn't clear the border, the shrunken puzzle is
  // strictly worse (fewer words AND still thin) — keep the full one.
  if(countThinBorderLines(built, maxFill) > 0 && placed.length < rawPlaced.length){
    return { placed: rawPlaced, puzzle: original };
  }
  return { placed, puzzle: built };
}

// Wraps generateCrossword()+buildGrid() with a few extra tries when the
// first attempt leaves a thin row or column (empty, or holding only a
// single lonely letter), and crops every attempt down to its content's
// bounding box before checking. Cropping alone already rules out a wasted
// *empty* border row/column (see the note on cropToContent above) — with a
// fixed gridSize, generateCrossword doesn't always use the whole square,
// and this is what turns that leftover margin into a smaller, fully-used
// board instead of a visible blank stripe. But cropping can still leave a
// border row/column with just one cell in it (whichever single word
// happened to reach furthest), which reads just as oddly as a fully blank
// one — the retry loop rejects those too. If nothing within maxTries comes
// back with a clean border, trimThinBorders() prunes the stray word(s)
// from the best attempt instead of shipping a thin-edged board.
function generateFilledPuzzle(bank, target, attempts, gridSize, maxTries){
  maxTries = maxTries || 4;
  let bestResult = null, bestPuzzle = null, bestScore = -Infinity;
  for(let i=0;i<maxTries;i++){
    const result = generateCrossword(bank, target, attempts, gridSize);
    const built = cropToContent(buildGrid(result, gridSize));
    const thinBorders = countThinBorderLines(built, 1);
    if(thinBorders === 0) return { result, puzzle: built };
    const score = -thinBorders * 1000 + result.placed.length;
    if(score > bestScore){ bestScore = score; bestResult = result; bestPuzzle = built; }
  }
  const minWords = Math.max(4, Math.ceil(target * 0.5));
  const trimmed = trimThinBorders(bestResult.placed, gridSize, 1, minWords);
  return { result: bestResult, puzzle: trimmed.puzzle };
}

// Crops a built puzzle down to the tight bounding box of its actually-
// placed letters — no padding, so the result can be (and usually is)
// rectangular rather than square. A crossword doesn't need to be square;
// what it must never have is a fully blank row or column, and forcing a
// square (the old cropAndSquare behavior) actually *created* one whenever
// the tight content wasn't already square, by padding the shorter side
// with empty cells. Cropping to exactly the content's bounding box instead
// makes a wasted border row/column structurally impossible: by
// definition, the first and last row and the first and last column of the
// result always contain at least one letter.
function cropToContent(puzzle){
  const { grid, rows, cols, words } = puzzle;
  let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(grid[r][c]){
        if(r < minR) minR = r;
        if(r > maxR) maxR = r;
        if(c < minC) minC = c;
        if(c > maxC) maxC = c;
      }
    }
  }
  if(minR === Infinity){
    return { grid: [], rows: 0, cols: 0, words: [] };
  }
  const newRows = maxR - minR + 1, newCols = maxC - minC + 1;
  const newGrid = Array.from({length: newRows}, (_, r) =>
    Array.from({length: newCols}, (_, c) => grid[r + minR][c + minC])
  );
  // Cropping only removes cells that were already empty on every side, so
  // it never changes which cell starts which word — the clue numbers
  // buildGrid() assigned stay correct as-is, just shifted onto the new,
  // smaller coordinate space.
  const newWords = words.map(w => Object.assign({}, w, { row: w.row - minR, col: w.col - minC }));
  return { grid: newGrid, rows: newRows, cols: newCols, words: newWords };
}

// Korean's self-sizing counterpart to generateFilledPuzzle(): generates
// against a generous (not final) bound, then crops to content. Keeps
// trying (up to maxTries) for a crop with a clean border (see
// countThinBorderLines) — cropping already rules out an empty border
// row/column by construction, but not a border row/column with just one
// lonely cell in it, so this retry loop is what actually catches that
// case. If nothing within maxTries comes back clean, trimThinBorders()
// prunes the stray word(s) from the best attempt instead of shipping a
// thin-edged board — same fallback generateFilledPuzzle() uses.
function generateSelfSizedPuzzle(bank, target, attempts, genBound, maxTries){
  maxTries = maxTries || 8;
  let best = null, bestScore = -Infinity, bestRawPlaced = null;
  for(let i=0;i<maxTries;i++){
    const result = generateCrossword(bank, target, attempts, genBound);
    if(result.placed.length < target) continue;
    const cropped = cropToContent(buildGrid(result, genBound));
    const thinBorders = countThinBorderLines(cropped, 1);
    if(thinBorders === 0) return { puzzle: cropped };
    const score = -thinBorders * 1000 + result.placed.length;
    if(score > bestScore){ bestScore = score; best = cropped; bestRawPlaced = result.placed; }
  }
  if(!bestRawPlaced){
    const result = generateCrossword(bank, target, attempts, genBound);
    bestRawPlaced = result.placed;
    best = cropToContent(buildGrid(result, genBound));
  }
  const minWords = Math.max(4, Math.ceil(target * 0.5));
  const trimmed = trimThinBorders(bestRawPlaced, genBound, 1, minWords);
  return { puzzle: trimmed.puzzle };
}

/* ---------------------------------------------------------
   4. UI STATE + RENDERING
--------------------------------------------------------- */
let currentLang = null;
let currentDifficulty = null;
let currentTopic = "fruits";
let puzzle = null;         // {grid, rows, cols, words}
let inputs = null;         // 2D array mirroring grid, holding <input> or null
let activeWord = null;     // currently highlighted word (for arrow/typing nav)
let lastClickCell = null;  // {r,c} of the last cell clicked/tapped, used to detect a repeat tap on the same cell (across/down toggle)
let compositionSettleTimer = null; // fallback timer that advances a cell once its IME composition goes quiet, without needing Enter
let isComposing = false;   // true while an IME composition (kana/hangul) is in progress

const LANG_NATIVE = { ja: "日本語", ko: "한국어", en: "English" };

const el = {
  grid: document.getElementById("grid"),
  acrossList: document.getElementById("acrossList"),
  downList: document.getElementById("downList"),
  status: document.getElementById("statusLine"),
  topicSelect: document.getElementById("topicSelect"),
  homeView: document.getElementById("homeView"),
  difficultyView: document.getElementById("difficultyView"),
  puzzleView: document.getElementById("puzzleView"),
  diffCards: document.getElementById("diffCards"),
  hero: document.getElementById("hero"),
  activeClueBar: document.getElementById("activeClueBar"),
  activeClueNumber: document.getElementById("activeClueNumber"),
  activeClueText: document.getElementById("activeClueText")
};

function showView(name){
  el.homeView.classList.toggle("hidden", name !== "home");
  el.difficultyView.classList.toggle("hidden", name !== "difficulty");
  el.puzzleView.classList.toggle("hidden", name !== "puzzle");
  if(el.hero) el.hero.classList.toggle("hero-collapsed", name !== "home");
}

function populateTopicSelect(){
  el.topicSelect.innerHTML = "";
  const available = TOPICS.filter(t => !(t.noLang && t.noLang.indexOf(currentLang) !== -1));
  if(!available.some(t => t.id === currentTopic)) currentTopic = available[0].id;
  available.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.label[currentLang];
    opt.disabled = !t.enabled;
    el.topicSelect.appendChild(opt);
  });
  el.topicSelect.value = currentTopic;
}

function applyLangStrings(){
  document.documentElement.lang = currentLang;
  const s = STR[currentLang];
  document.getElementById("topicLabel").textContent = s.topicLabel;
  document.getElementById("newPuzzleLabel").textContent = s.newPuzzle;
  document.getElementById("checkLabel").textContent = s.check;
  document.getElementById("revealLabel").textContent = s.reveal;
  document.getElementById("acrossLabel").textContent = s.across;
  document.getElementById("downLabel").textContent = s.down;
  document.getElementById("footerNote").textContent = s.footer;
  document.getElementById("backToHomeLabel").textContent = s.backToHome;
  document.getElementById("backToDiffLabel").textContent = s.backToDiff;
  document.getElementById("badgeLang").textContent = LANG_NATIVE[currentLang];
  document.documentElement.lang = currentLang;
  populateTopicSelect();
}

function renderDiffCards(){
  const s = STR[currentLang];
  el.diffCards.innerHTML = "";
  const heading = document.createElement("p");
  heading.className = "status-line";
  heading.style.marginBottom = "12px";
  heading.textContent = s.diffHeading;
  el.diffCards.parentElement.insertBefore(heading, el.diffCards);
  DIFFICULTY_ORDER.forEach((id, i) => {
    const info = s.diff[id];
    const btn = document.createElement("button");
    btn.className = "diff-card";
    btn.dataset.diff = id;
    const dots = document.createElement("span");
    dots.className = "dots";
    dots.textContent = "●".repeat(i+1) + "○".repeat(2-i);
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = info.label;
    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = info.desc;
    btn.appendChild(dots);
    btn.appendChild(label);
    btn.appendChild(desc);
    btn.addEventListener("click", () => selectDifficulty(id));
    el.diffCards.appendChild(btn);
  });
}

function selectLanguage(lang){
  currentLang = lang;
  applyLangStrings();
  el.difficultyView.querySelectorAll(".status-line").forEach(x => x.remove());
  renderDiffCards();
  showView("difficulty");
}

function selectDifficulty(diff){
  currentDifficulty = diff;
  document.getElementById("badgeDiff").textContent = STR[currentLang].diff[diff].label;
  showView("puzzle");
  newPuzzle();
}

// The "back" crumbs used to rely on history.back()/pushState, but an
// artifact runs inside a sandboxed iframe where the browser History API
// is not reliably available to it, so back() could silently fail to
// fire a popstate at all. Going directly to the target view instead
// works everywhere and doesn't depend on iframe/browser history state.
function goToHome(){
  currentDifficulty = null;
  showView("home");
}

function goToDifficulty(){
  currentDifficulty = null;
  el.difficultyView.querySelectorAll(".status-line").forEach(x => x.remove());
  showView("difficulty");
}

function setStatus(text, cls){
  el.status.textContent = text;
  el.status.className = "status-line" + (cls ? " " + cls : "");
}

function newPuzzle(){
  if(!currentLang || !currentDifficulty) return;
  const fullBank = WORDS[currentTopic] && WORDS[currentTopic][currentLang];
  if(!fullBank){ return; }
  const cfg = DIFFICULTY_CONFIG[currentTopic][currentLang][currentDifficulty];
  let built;
  if(currentLang === "ko"){
    const bank = fullBank.filter(e => (e.lv||1) <= cfg.level && Array.from(e.w).length <= KO_GEN_BOUND);
    built = generateSelfSizedPuzzle(bank, cfg.target, 15000, KO_GEN_BOUND, 8).puzzle;
  } else {
    const gridSize = GRID_SIZE[currentTopic][currentLang][currentDifficulty];
    const bank = fullBank.filter(e => (e.lv||1) <= cfg.level && Array.from(e.w).length <= gridSize);
    built = generateFilledPuzzle(bank, cfg.target, 25000, gridSize, 5).puzzle;
  }
  puzzle = built;
  renderGrid();
  renderClues();
  setStatus(STR[currentLang].statusEmpty, "");
}

function renderGrid(){
  activeWord = null;
  lastClickCell = null;
  updateActiveClueBar(null);
  const { grid, rows, cols } = puzzle;
  el.grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  el.grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  el.grid.innerHTML = "";
  inputs = Array.from({length: rows}, () => Array(cols).fill(null));

  const numberAtCoord = new Map();
  puzzle.words.forEach(w => numberAtCoord.set(w.row+","+w.col, w.number));

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const cellDiv = document.createElement("div");
      const letter = grid[r][c];
      if(!letter){
        cellDiv.className = "cell block";
        el.grid.appendChild(cellDiv);
        continue;
      }
      cellDiv.className = "cell";
      cellDiv.dataset.r = r;
      cellDiv.dataset.c = c;

      const num = numberAtCoord.get(r+","+c);
      if(num){
        const numSpan = document.createElement("span");
        numSpan.className = "num";
        numSpan.textContent = num;
        cellDiv.appendChild(numSpan);
      }

      const input = document.createElement("input");
      input.setAttribute("maxlength", "1");
      input.setAttribute("autocomplete", "off");
      input.setAttribute("autocapitalize", "characters");
      input.setAttribute("inputmode", currentLang === "en" ? "text" : "text");
      input.dataset.r = r;
      input.dataset.c = c;
      input.addEventListener("input", onCellInput);
      input.addEventListener("compositionstart", onCompositionStart);
      input.addEventListener("compositionupdate", onCompositionUpdate);
      input.addEventListener("compositionend", onCompositionEnd);
      input.addEventListener("keydown", onCellKeydown);
      input.addEventListener("focus", () => onCellFocus(r, c));
      input.addEventListener("pointerdown", () => onCellPointerDown(r, c));
      cellDiv.appendChild(input);
      el.grid.appendChild(cellDiv);
      inputs[r][c] = input;
    }
  }
}

function renderClues(){
  el.acrossList.innerHTML = "";
  el.downList.innerHTML = "";
  puzzle.words.forEach(w => {
    const li = document.createElement("li");
    li.dataset.number = w.number;
    li.dataset.dir = w.dir;
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = w.number + ".";
    const t = document.createElement("span");
    t.textContent = w.clue + "\u3000(" + w.len + ")";
    li.appendChild(n);
    li.appendChild(t);
    li.addEventListener("click", () => {
      focusWord(w);
    });
    (w.dir === "across" ? el.acrossList : el.downList).appendChild(li);
  });
}

// All words (0, 1, or 2) that occupy a given cell, across and/or down.
function wordsAtCell(r, c){
  return puzzle.words.filter(w => {
    if(w.dir === "across") return w.row === r && c >= w.col && c < w.col + w.len;
    return w.col === c && r >= w.row && r < w.row + w.len;
  });
}

function findWordAt(r, c, preferDir){
  const candidates = wordsAtCell(r, c);
  if(candidates.length === 0) return null;
  if(preferDir){
    const match = candidates.find(w => w.dir === preferDir);
    if(match) return match;
  }
  return candidates[0];
}

function onCellFocus(r, c){
  // A focus that lands on a different cell than the last click means the
  // click-to-toggle streak (see onCellClick) no longer applies to that
  // earlier cell, so a later click straight back onto it is treated as a
  // fresh tap rather than a toggle.
  if(!lastClickCell || lastClickCell.r !== r || lastClickCell.c !== c){
    lastClickCell = null;
  }
  const preferDir = activeWord && (activeWord.dir === "across" || activeWord.dir === "down")
    ? activeWord.dir : null;
  // A tapped cell may be the FIRST cell of one or two words (that's what
  // its printed number means). Tapping a numbered cell should always
  // select a word that starts there, even if the previously active word
  // happened to pass through this cell too — otherwise tapping cell "2"
  // right after cell "1" was active kept showing word 1's clue, since
  // findWordAt's preferDir carried the old direction forward regardless
  // of what was actually tapped. Only when the cell starts no word of
  // its own (a plain continuation cell) do we fall back to preferDir so
  // arrow-key/typing navigation still tracks the word being typed.
  const startingWords = puzzle.words.filter(w => w.row === r && w.col === c);
  let word;
  if(startingWords.length === 1){
    word = startingWords[0];
  } else if(startingWords.length > 1){
    word = (preferDir && startingWords.find(w => w.dir === preferDir)) || startingWords[0];
  } else {
    word = findWordAt(r, c, preferDir);
  }
  focusWord(word, r, c);
}

// A cell where both an across and a down word meet (most often a numbered
// cell that starts both, like "4" in the crossing example) shows only one
// clue at a time. Tapping that same cell again — while it's already
// focused, so no new "focus" event fires — switches to the other
// direction's word instead of doing nothing, so both clues are reachable
// from the one cell.
//
// This runs on "pointerdown" rather than "click": focusWord() scrolls the
// matching clue into view as part of handling focus, and on a touchscreen
// a scroll that happens between touchstart and touchend can make the
// browser cancel the click event entirely (it reinterprets the touch as a
// scroll instead of a tap). Using pointerdown means the toggle still
// fires reliably even when that scroll cancels the click.
function onCellPointerDown(r, c){
  const isRepeatTap = !!(lastClickCell && lastClickCell.r === r && lastClickCell.c === c && activeWord);
  lastClickCell = { r, c };
  if(!isRepeatTap) return; // fresh landing: the upcoming "focus" event picks the default word
  const candidates = wordsAtCell(r, c);
  if(candidates.length < 2) return;
  const other = candidates.find(w => w.dir !== activeWord.dir);
  if(other) focusWord(other, r, c);
}

function focusWord(word, r, c){
  if(!word) return;
  activeWord = word;
  document.querySelectorAll(".cell.active-word").forEach(x => x.classList.remove("active-word"));
  document.querySelectorAll(".clues li.active").forEach(x => x.classList.remove("active"));
  for(let i=0;i<word.len;i++){
    const rr = word.dir === "down" ? word.row + i : word.row;
    const cc = word.dir === "across" ? word.col + i : word.col;
    const input = inputs[rr] && inputs[rr][cc];
    if(input) input.closest(".cell").classList.add("active-word");
  }
  const li = document.querySelector(`.clues li[data-number="${word.number}"][data-dir="${word.dir}"]`);
  if(li){ li.classList.add("active"); li.scrollIntoView({block:"nearest"}); }
  updateActiveClueBar(word);
  if(typeof r === "number" && typeof c === "number" && inputs[r][c] && document.activeElement !== inputs[r][c]){
    inputs[r][c].focus();
  }
}

// Keeps the mobile "active clue" bar (shown just above the grid, below the
// 720px breakpoint where the clue list is a visible side panel instead) in
// sync with whichever word is currently focused, so a tap on a numbered
// cell shows its clue without needing to scroll down to the clue list.
function updateActiveClueBar(word){
  if(!el.activeClueBar || !el.activeClueNumber || !el.activeClueText) return;
  if(!word || !currentLang){
    el.activeClueBar.classList.add("hidden");
    return;
  }
  const dirLabel = word.dir === "across" ? STR[currentLang].acrossShort : STR[currentLang].downShort;
  el.activeClueNumber.textContent = `${word.number} ${dirLabel}`;
  el.activeClueText.textContent = `${word.clue}　(${word.len})`;
  el.activeClueBar.classList.remove("hidden");
}

function onCellInput(e){
  // While an IME (romaji -> kana/hangul) is composing, the browser fires
  // several "input" events for a single character the user is typing.
  // Advancing focus on each of those was the bug: it kept moving to the
  // next cell mid-composition, spilling one intended letter across
  // several cells. So during composition we do nothing and wait for the
  // official "compositionend" event below.
  if(e.isComposing || isComposing) return;
  clearTimeout(compositionSettleTimer);
  commitCellValue(e.target);
}

function onCompositionStart(){
  isComposing = true;
  clearTimeout(compositionSettleTimer);
}

function onCompositionEnd(e){
  isComposing = false;
  clearTimeout(compositionSettleTimer);
  commitCellValue(e.target);
}

// Each cell only ever holds one character, so as soon as a kana/hangul
// composition has produced one, there is nothing left to type in that
// cell — but the browser doesn't know that, and (Korean especially) won't
// fire "compositionend" on its own until something else happens: another
// keystroke, tapping away, or pressing Enter. Left alone, that meant the
// cell never advanced without an explicit Enter press. This watches for
// the composition going quiet with a character already in it and, after a
// short pause, treats it as finished and advances — without waiting for
// the browser's own compositionend, which will still arrive harmlessly
// later (composing text is already in input.value long before then, so
// re-running commitCellValue on it is a no-op).
function onCompositionUpdate(e){
  clearTimeout(compositionSettleTimer);
  const input = e.target;
  compositionSettleTimer = setTimeout(() => {
    if(input.value) commitCellValue(input);
  }, 400);
}

function commitCellValue(input){
  input.value = input.value.slice(-1).toUpperCase();
  input.closest(".cell").classList.remove("correct", "wrong");
  if(input.value && activeWord){
    const r = Number(input.dataset.r), c = Number(input.dataset.c);
    const next = nextCellInWord(activeWord, r, c, 1);
    if(next) next.focus();
  }
}

function onCellKeydown(e){
  const r = Number(e.target.dataset.r), c = Number(e.target.dataset.c);
  if(e.key === "Backspace" && !e.target.value && activeWord){
    const prev = nextCellInWord(activeWord, r, c, -1);
    if(prev){ prev.focus(); prev.value = ""; e.preventDefault(); }
    return;
  }
  let dr=0, dc=0;
  if(e.key === "ArrowRight") dc=1;
  else if(e.key === "ArrowLeft") dc=-1;
  else if(e.key === "ArrowDown") dr=1;
  else if(e.key === "ArrowUp") dr=-1;
  else return;
  e.preventDefault();
  const target = inputs[r+dr] && inputs[r+dr][c+dc];
  if(target) target.focus();
}

function nextCellInWord(word, r, c, step){
  if(word.dir === "across"){
    const nc = c + step;
    if(nc < word.col || nc >= word.col + word.len) return null;
    return inputs[r][nc];
  } else {
    const nr = r + step;
    if(nr < word.row || nr >= word.row + word.len) return null;
    return inputs[nr][c];
  }
}

function checkAnswers(){
  const { grid, rows, cols } = puzzle;
  let allFilled = true, allCorrect = true;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const letter = grid[r][c];
      if(!letter) continue;
      const input = inputs[r][c];
      const cellDiv = input.closest(".cell");
      cellDiv.classList.remove("correct","wrong");
      if(!input.value){ allFilled = false; continue; }
      if(input.value === letter.toUpperCase()){
        cellDiv.classList.add("correct");
      } else {
        cellDiv.classList.add("wrong");
        allCorrect = false;
      }
    }
  }
  const s = STR[currentLang];
  if(!allFilled) setStatus(s.statusIncomplete, "");
  else if(allCorrect) setStatus(s.statusCorrect, "correct");
  else setStatus(s.statusWrong, "wrong");
}

function revealAnswers(){
  const { grid, rows, cols } = puzzle;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const letter = grid[r][c];
      if(!letter) continue;
      const input = inputs[r][c];
      input.value = letter.toUpperCase();
      const cellDiv = input.closest(".cell");
      cellDiv.classList.remove("wrong");
      cellDiv.classList.add("correct");
    }
  }
  setStatus(STR[currentLang].revealed, "correct");
}

/* ---------------------------------------------------------
   5b. LIGHT / DARK TOGGLE
   The page already follows the OS's light/dark preference via
   prefers-color-scheme (see :root vs. the dark media query in <style>).
   This button lets a visitor override that for the current visit:
   manualTheme stays null (follow the system) until they click, then
   flips to an explicit "light"/"dark" that's written to
   documentElement's data-theme attribute, which the CSS already knows
   how to honor. There's no localStorage here (artifacts don't get
   persistent storage), so the override only lasts for this page load.
--------------------------------------------------------- */
const themeToggleBtn = document.getElementById("themeToggleBtn");
let manualTheme = null;
function systemPrefersDark(){
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function isDarkNow(){
  return manualTheme ? manualTheme === "dark" : systemPrefersDark();
}
function applyTheme(){
  if(manualTheme){
    document.documentElement.setAttribute("data-theme", manualTheme);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  themeToggleBtn.textContent = isDarkNow() ? "☀️" : "🌙";
}
themeToggleBtn.addEventListener("click", () => {
  manualTheme = isDarkNow() ? "light" : "dark";
  applyTheme();
});
applyTheme();
